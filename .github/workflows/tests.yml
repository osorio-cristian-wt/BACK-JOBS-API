name: Tests backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correr tests en el mismo contenedor que en local
        run: docker compose run --rm tests

      - name: Publicar reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-tests
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Levantar la API y correr E2E de /api/assign (Newman)
        run: docker compose run --rm e2e

      - name: Publicar reporte E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-assign
          path: target/e2e/
          if-no-files-found: warn

      - name: Logs de la API si falló
        if: failure()
        run: docker compose logs api

      - name: Bajar contenedores
        if: always()
        run: docker compose down
